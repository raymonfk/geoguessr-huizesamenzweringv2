<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GeoGuessr Vriendenquiz</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
}
.top {
    padding: 14px 16px 10px;
    text-align: center;
    position: relative;
}
.top h1 { margin: 0; font-size: 22px; }
.top p { margin: 5px 0 0; color: #cbd5e1; font-size: 14px; }

/* Versie indicator */
.version-badge {
    position: absolute;
    top: 10px;
    right: 15px;
    background: #22c55e;
    color: white;
    font-size: 11px;
    font-weight: bold;
    padding: 3px 6px;
    border-radius: 6px;
}

#map {
    width: 100%;
    height: 400px;
}

.panel {
    padding: 12px 16px 18px;
    background: #111827;
}
input {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #475569;
    background: #1e293b;
    color: white;
    font-size: 16px;
    margin-bottom: 9px;
    outline: none;
}
input:focus {
    border-color: #22c55e;
}
button {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    background: #22c55e;
    color: white;
    cursor: pointer;
}
button:disabled {
    background: #475569;
    cursor: not-allowed;
}
#selected {
    text-align: center;
    color: #cbd5e1;
    font-size: 14px;
    margin: 5px 0 10px;
}
.help {
    text-align: center;
    font-size: 13px;
    color: #94a3b8;
    margin-top: 9px;
}
</style>
</head>

<body>

<div class="top">
    <span class="version-badge">Versie: v7</span>
    <h1>🌍 GeoGuessr Quiz</h1>
    <p id="roundText">Ronde 1 — kies jouw locatie</p>
</div>

<div id="map"></div>

<div class="panel">
    <input id="name" type="text" placeholder="Jouw naam">
    <div id="selected">Tik op de kaart om je gok te plaatsen</div>
    <button id="send" disabled>📍 Antwoord versturen via WhatsApp</button>
    <div class="help">Je kunt je pin verplaatsen door opnieuw op de kaart te tikken.</div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ============================================================
// INSTELLINGEN
// ============================================================

// Pas per ronde dit getal aan
const ROUND = 1;

// ============================================================

// Kaart initialisatie
const map = L.map('map').setView([20, 0], 2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

setTimeout(function() {
    map.invalidateSize();
}, 200);

let marker = null;
let answer = null;

document.getElementById("roundText").textContent =
    "Ronde " + ROUND + " — kies jouw locatie";

map.on("click", function(e) {
    answer = {
        lat: e.latlng.lat,
        lon: e.latlng.lng
    };

    if (marker) {
        marker.setLatLng(e.latlng);
    } else {
        marker = L.marker(e.latlng).addTo(map);
    }

    document.getElementById("selected").textContent =
        "📍 Locatie gekozen! Je kunt de pin nog verplaatsen.";

    checkFormReady();
});

document.getElementById("name").addEventListener("input", checkFormReady);

function checkFormReady() {
    const name = document.getElementById("name").value.trim();
    const sendBtn = document.getElementById("send");
    
    if (name && answer) {
        sendBtn.disabled = false;
    } else {
        sendBtn.disabled = true;
    }
}

document.getElementById("send").addEventListener("click", function() {
    const name = document.getElementById("name").value.trim();

    if (!name) {
        alert("Vul eerst je naam in.");
        return;
    }

    if (!answer) {
        alert("Kies eerst een plek op de kaart.");
        return;
    }

    const lat = answer.lat.toFixed(6);
    const lon = answer.lon.toFixed(6);

    const message =
        "🌍 GeoGuessr antwoord\n" +
        "Ronde: " + ROUND + "\n" +
        "Naam: " + name + "\n" +
        "Latitude: " + lat + "\n" +
        "Longitude: " + lon;

    // Geen telefoonnummer in de link; WhatsApp vraagt de speler zelf om een contact te kiezen
    const url = "https://wa.me/?text=" + encodeURIComponent(message);

    window.location.href = url;
});
</script>

</body>
</html>
